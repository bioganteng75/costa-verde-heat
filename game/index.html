<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="description" content="Costa Verde Heat v2 — a top-down open-world crime game in the browser: a pseudo-3D coastal city, seven story jobs, street races, police roadblocks and a day that rolls into dusk.">
<title>Costa Verde Heat v2 — an open-world crime game</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #79c7e3; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: crosshair; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" aria-label="Costa Verde Heat: explore a coastal city on foot, by car, truck or motorcycle, run seven jobs for Marisol Vega, race the street series, and dodge the Policía."></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
